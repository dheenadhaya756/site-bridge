<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Agent Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/preview.css">
</head>
<body>
  <div class="bar">
    <a class="brand" id="home" href="/" title="Back to Site Bridge home"><span class="mark"><svg class="sb-mark" viewBox="0 0 22 16" width="19" height="14" aria-hidden="true"><path d="M7.2 1h13.6l-3.2 5.6H4z" fill="#2238f5"/><path d="M4.4 9.4H18l-3.2 5.6H1.2z" fill="#2238f5"/></svg></span><span class="wm">Site Bridge<sup>°</sup></span></a>
    <a id="results" class="back-btn" href="/" title="Back to this site's results"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Results</a>
    <div class="nav-btns">
      <button id="back" title="Back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button id="reload" title="Reload" aria-label="Reload"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
    <form id="addr" class="addr">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input id="url" spellcheck="false" autocomplete="off" aria-label="Page address">
    </form>
    <span class="live"><i></i>Live demo · agent added to your site</span>
    <a id="share" class="pill-btn" href="#" target="_blank" rel="noopener">Open full screen <span class="arr">→</span></a>
  </div>
  <div class="frame-wrap">
    <iframe id="site" title="Website preview" allow="clipboard-write; fullscreen"></iframe>
    <div id="loading" class="loading"><div class="spinner"></div><span>Loading your website with its new AI agent…</span></div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="/preview.js"></script>
</body>
</html>
